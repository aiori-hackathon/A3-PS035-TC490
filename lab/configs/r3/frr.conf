! NEXORA — R3 FRRouting Configuration
! Team: A3-PS035-TC490 | PS-035
! Role: Aggregation Node B
! OSPF Router-ID: 3.3.3.3
!
! Interfaces:
!   lo       192.168.255.3/32  Loopback — OSPF Area 0
!   eth1     10.0.23.2/30      Link L23 to R2 — OSPF Area 0
!   eth2     10.0.34.1/30      Link L34 to R4 — OSPF Area 0
!   eth0     192.168.100.3/24  Management — OSPF passive
!
frr version 8.4
frr defaults traditional
hostname r3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 192.168.255.3/32
!
interface eth1
 description Link-L23-to-R2
 ip address 10.0.23.2/30
 ip ospf network point-to-point
 ip ospf cost 1
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth2
 description Link-L34-to-R4
 ip address 10.0.34.1/30
 ip ospf network point-to-point
 ip ospf cost 1
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth0
 description Management-passive
!
router ospf
 ospf router-id 3.3.3.3
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 passive-interface eth0
 network 192.168.255.3/32 area 0.0.0.0
 network 10.0.23.0/30 area 0.0.0.0
 network 10.0.34.0/30 area 0.0.0.0
!
line vty
!
